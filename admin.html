<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — Orders & Operations | Bluewell Ventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #F4F1EA;">

  <header class="site-header" style="background-color: #fff;">
    <div class="container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo">Bluewell<span>Admin</span></a>
        <div style="display:flex; align-items:center; gap: 1rem;">
          <a href="index.html" class="btn btn-outline" style="min-height: 40px; padding: 0.4rem 1rem; font-size: 0.85rem;">View Storefront →</a>
        </div>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
        <div>
          <h1>Store Operations & Orders</h1>
          <p style="color: var(--text-muted);">Real-time orders stored securely in your browser's LocalStorage.</p>
        </div>
        <button type="button" class="btn btn-outline" onclick="clearAllOrders()" style="color:#B3261E; border-color:#B3261E; min-height:40px;">
          Clear Test Orders
        </button>
      </div>

      <!-- Live Metrics Overview -->
      <div class="admin-stats-grid">
        <div class="stat-card">
          <span>Total Orders Received</span>
          <h3 id="admin-total-orders">0</h3>
        </div>
        <div class="stat-card">
          <span>Gross Revenue</span>
          <h3 id="admin-total-revenue">₹0</h3>
        </div>
        <div class="stat-card">
          <span>Store Status</span>
          <h3 style="color:var(--success); font-size:1.4rem; margin-top:0.7rem;">● Online & Accepting Orders</h3>
        </div>
      </div>

      <!-- Orders Table -->
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date & Time</th>
              <th>Customer</th>
              <th>Pack & Weights</th>
              <th>Total & Method</th>
              <th>Status</th>
              <th>Direct Action</th>
            </tr>
          </thead>
          <tbody id="admin-orders-content">
            <!-- Rendered by js/main.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
